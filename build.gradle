plugins {
    id 'fabric-loom' version '1.6.11'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // No extra repositories needed: everything comes from maven.fabricmc.net / Mojang.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    // GPL-3.0 要求随二进制分发附带许可证全文；第三方声明须一并随附（含内置 MIT 二进制的声明）
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    from("THIRD-PARTY-NOTICES.md") {
        rename { "THIRD-PARTY-NOTICES_${project.base.archivesName.get()}.md" }
    }
}