name: Release

# 在推送形如 v1.2.3 的标签时，自动构建并发布到 GitHub Releases。
# 构建产物（主包 + 对应源码包）会自动作为 Release 资产上传，满足 GPL-3.0 提供对应源码的要求。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Derive version (strip leading v)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/libs/*.jar
          body: |
            ## ✅ 只想联机？下载这个
            **下载 `openp2p-mc-${{ steps.ver.outputs.version }}.jar`**（文件名里**没有** `-sources`），放进 Minecraft 的 `mods` 文件夹即可，需要 Fabric Loader 0.15+（无需 Fabric API）。节点程序已内置，无需另装任何东西。
            ## ❌ 不要下载这个
            `openp2p-mc-${{ steps.ver.outputs.version }}-sources.jar` 是**源码包**，仅供开发者查看 / 二次构建，**不能当 mod 用**，放进去游戏也读不到。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
